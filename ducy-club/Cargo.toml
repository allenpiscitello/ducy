[package]
name = "ducy-club"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "ducy.cards' poker clubs: rules, money, tables, tournaments and promotions, on ducy-play's engine."
repository = "https://github.com/allenpiscitello/ducy"
publish = false

[dependencies]
ducy-play = { version = "0.2.0", path = "../ducy-play", default-features = false, features = ["serde"] }
rand = "0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
