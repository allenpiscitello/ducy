[package]
name = "ducy-shuffle"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "A trustless (mental poker) shuffle for ducy: layered, commutative encryption of a deck on Ristretto255."
repository = "https://github.com/allenpiscitello/ducy"
documentation = "https://docs.rs/ducy-shuffle"
readme = "README.md"
categories = ["cryptography", "game-engines"]
keywords = ["poker", "mental-poker", "shuffle", "ristretto"]

[dependencies]
ducy = { version = "0.6.0", path = "..", default-features = false }
curve25519-dalek = { version = "5", features = ["digest"] }
sha2 = "0.11"
rand = "0.10.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[[example]]
name = "shuffle_timing"
