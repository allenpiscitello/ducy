[package]
name = "ducy-shuffle"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "A trustless (mental poker) shuffle for ducy: layered, commutative encryption of a deck on Ristretto255."
repository = "https://github.com/allenpiscitello/ducy"
categories = ["cryptography", "game-engines"]
keywords = ["poker", "mental-poker", "shuffle", "ristretto"]

[dependencies]
ducy = { path = "..", default-features = false }
curve25519-dalek = { version = "4.1", features = ["digest"] }
sha2 = "0.10"
rand = "0.10.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[[example]]
name = "shuffle_timing"
