[package]
name = "ducy-play"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Play out poker hands: blinds, betting, side pots and showdown, built on ducy."
repository = "https://github.com/allenpiscitello/ducy"
documentation = "https://docs.rs/ducy-play"
readme = "README.md"
categories = ["game-engines"]
keywords = ["poker", "holdem", "omaha", "simulation"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["serde", "fair-deal"]
# Serialize rules, observations, events and results (JSON for external bots).
serde = ["dep:serde", "ducy/serde"]
# Provably fair commit–reveal deals (the `fair_deal` module), with SHA-256.
fair-deal = ["dep:sha2"]

[dependencies]
ducy = { version = "0.6.0", path = "..", default-features = false }
rand = "0.10.2"
sha2 = { version = "0.11", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "fair_deal"
required-features = ["fair-deal"]

[[test]]
name = "fair_vectors"
required-features = ["fair-deal"]
