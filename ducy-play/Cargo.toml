[package]
name = "ducy-play"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "Play out poker hands: blinds, betting, side pots and showdown, built on ducy."
repository = "https://github.com/allenpiscitello/ducy"
documentation = "https://docs.rs/ducy-play"
readme = "README.md"
categories = ["game-engines"]
keywords = ["poker", "holdem", "omaha", "simulation"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["process"]
# Serialize rules, observations, events and results (JSON for external bots).
serde = ["dep:serde", "ducy/serde"]
# Run bots as separate programs that talk JSON over stdin/stdout.
process = ["serde", "dep:serde_json"]

[dependencies]
ducy = { version = "0.3.0", path = "..", default-features = false }
rand = "0.10.2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[[test]]
name = "bots"
required-features = ["process"]

[[example]]
name = "bot_match"
required-features = ["process"]

[[test]]
name = "snapshot"
required-features = ["serde"]
