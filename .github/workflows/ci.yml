name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # The registry and built dependencies, kept between runs.
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --no-default-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # A prebuilt wasm-pack instead of compiling it on every run.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cd ducy-play-wasm && wasm-pack build --target web
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd ducy-play-wasm && wasm-pack build --target nodejs --out-dir pkg-node
      - run: node ducy-play-wasm/tests/smoke.cjs
      # ducy.cards' crates and their wasm tests live in DUCY-CARDS/ducy-web (rust/).
