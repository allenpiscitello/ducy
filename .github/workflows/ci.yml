name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test --no-default-features

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack
      - run: cd ducy-wasm && wasm-pack build --target web
      - run: cd ducy-play-wasm && wasm-pack build --target web
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd ducy-play-wasm && wasm-pack build --target nodejs --out-dir pkg-node
      - run: node ducy-play-wasm/tests/smoke.cjs
      - run: cd ducy-wasm && wasm-pack build --target nodejs --out-dir pkg-node
      - run: node ducy-wasm/tests/friends.cjs
      - run: node ducy-wasm/tests/stats.cjs
      - run: node ducy-wasm/tests/structure.cjs
      - run: node ducy-wasm/tests/ranges.cjs
      - run: node ducy-wasm/tests/omaha-hand.cjs
      - run: node ducy-wasm/tests/fair.cjs
      - run: node ducy-wasm/tests/replay.cjs
      - run: node ducy-wasm/tests/partial-board.cjs
      - run: cargo run -p ducy-gto --example tiny_model -- target/tiny-model
      - run: node ducy-wasm/tests/review.cjs
