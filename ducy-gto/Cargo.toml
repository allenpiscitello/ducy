[package]
name = "ducy-gto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "Game-theory-optimal poker strategies with counterfactual regret minimization, built on ducy."
repository = "https://github.com/allenpiscitello/ducy"
categories = ["game-engines", "algorithms"]
keywords = ["poker", "cfr", "gto", "nash", "holdem"]
# Not on crates.io yet: the solver's API is still changing (turn solving,
# Omaha). Publish once it settles, after ducy and ducy-play.
publish = false

[features]
default = ["parallel"]
# Train with every core (rayon). Results don't depend on the thread count.
parallel = ["dep:rayon"]
# Serialize hand reviews.
serde = ["dep:serde"]

[dependencies]
ducy = { version = "0.3.0", path = "..", default-features = false }
ducy-play = { version = "0.1.0", path = "../ducy-play", default-features = false }
rand = "0.10.2"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
rayon = "1.12.0"
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "mccfr"
harness = false
