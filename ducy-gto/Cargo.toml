[package]
name = "ducy-gto"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "Game-theory-optimal poker strategies with counterfactual regret minimization, built on ducy."
repository = "https://github.com/allenpiscitello/ducy"
categories = ["game-engines", "algorithms"]
keywords = ["poker", "cfr", "gto", "nash", "holdem"]

[features]
default = ["parallel"]
# Train with every core (rayon). Results don't depend on the thread count.
parallel = ["dep:rayon"]

[dependencies]
ducy = { path = "..", default-features = false }
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
ducy-play = { path = "../ducy-play", default-features = false }
rayon = "1.12.0"
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "mccfr"
harness = false
