[package]
name = "ducy"
version = "0.2.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/allenpiscitello/ducy"
description = "A performant analysis library for poker."
categories = ["game-engines", "algorithms"]
keywords = ["poker", "holdem", "omaha", "equity", "cards"]


[dependencies]
strum = "0.28.0"
strum_macros = "0.28.0"
rand = "0.10.2"
numerica = "2.2.0"
rust_decimal = "1.42.1"
rust_decimal_macros = "1.40.0"

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }

[[bench]]
name = "equity"
harness = false

[[bench]]
name = "hand_ranking"
harness = false

[[bench]]
name = "deck_iteration"
harness = false
