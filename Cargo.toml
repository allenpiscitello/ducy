[workspace]
members = [".", "ducy-play", "ducy-bots", "ducy-host", "ducy-play-wasm", "ducy-gto", "ducy-shuffle", "ducy-identity"]

[package]
name = "ducy"
version = "0.3.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
readme = "README.md"
repository = "https://github.com/allenpiscitello/ducy"
documentation = "https://docs.rs/ducy"
description = "A performant analysis library for poker."
categories = ["game-engines", "algorithms"]
keywords = ["poker", "holdem", "omaha", "equity", "cards"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
serde = ["dep:serde", "rust_decimal/serde-with-str"]

[dependencies]
strum = "0.28.0"
strum_macros = "0.28.0"
rand = "0.10.2"
rust_decimal = "1.42.1"
rust_decimal_macros = "1.40.0"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.7.0", features = ["html_reports"] }
serde_json = "1"

# The curve arithmetic in ducy-shuffle is ~50x slower unoptimized; keep
# debug builds and tests quick by optimizing just that dependency.
[profile.dev.package.curve25519-dalek]
opt-level = 3

# Tests deal thousands of hands, train abstractions and solve games, which
# runs 10-50 times slower unoptimized (CI's tests took over half an hour).
# `cargo test` builds optimized; overflow checks and debug assertions stay on
# (inherited from dev), so the tests still catch what they did, and line
# tables keep backtraces readable.
[profile.test]
opt-level = 2
debug = "line-tables-only"

[[bench]]
name = "equity"
harness = false

[[bench]]
name = "hand_ranking"
harness = false

[[bench]]
name = "deck_iteration"
harness = false

[[example]]
name = "omaha_equity_dataset"
required-features = ["parallel"]

[[example]]
name = "omaha_flop_quality"
required-features = ["parallel"]

[[example]]
name = "holdem_hand_quality"
required-features = ["parallel"]
