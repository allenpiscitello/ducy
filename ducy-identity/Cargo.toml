[package]
name = "ducy-identity"
version.workspace = true
edition = "2024"
rust-version.workspace = true
license = "MIT"
description = "Player identities for ducy: signed message envelopes, player IDs and their checks, as ducy-web's pages and relay use them."
repository = "https://github.com/allenpiscitello/ducy"
readme = "README.md"
# Only ducy-web uses it (pinned by git rev); it stays off crates.io.
publish = false
categories = ["cryptography"]
keywords = ["poker", "ed25519", "ecdsa", "signatures"]

[dependencies]
base64 = "0.23"
# Verification only: no randomness (and so no getrandom) needed.
ed25519-dalek = { version = "3", default-features = false }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
