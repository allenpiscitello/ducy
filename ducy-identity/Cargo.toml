[package]
name = "ducy-identity"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "Player identities for ducy: signed message envelopes, player IDs and their checks, as ducy-web's pages and relay use them."
repository = "https://github.com/allenpiscitello/ducy"
readme = "README.md"
categories = ["cryptography"]
keywords = ["poker", "ed25519", "ecdsa", "signatures"]

[dependencies]
base64 = "0.22"
# Verification only: no randomness (and so no getrandom) needed.
ed25519-dalek = { version = "2", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
