[package]
name = "ducy-quest"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "ducy.cards' Bankroll Quest: a seeded world of card rooms, their games, players and waitlists, and the quest's bankroll and clock."
repository = "https://github.com/allenpiscitello/ducy"
publish = false

[dependencies]
ducy-bot-games = { path = "../ducy-bot-games" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The JS fixture's floats must read back to the exact bits.
serde_json = { version = "1", features = ["float_roundtrip"] }
