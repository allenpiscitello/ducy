[package]
name = "ducy-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
# The site's bindings (ducy.cards), built with wasm-pack; not a crates.io crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The site's own: the bot tables, the GTO bots and the study pages' equity
# and ranges. The relay's build (ducy-web #463: clubs only) leaves them out:
# --no-default-features.
default = ["site"]
site = ["dep:ducy-gto", "dep:ducy-training", "dep:ducy-bot-games"]

[dependencies]
ducy = { version = "0.3.0", path = "..", default-features = false }
ducy-play = { version = "0.2.0", path = "../ducy-play", default-features = false, features = ["serde"] }
ducy-club = { path = "../ducy-club" }
ducy-gto = { path = "../ducy-gto", default-features = false, features = ["serde"], optional = true }
ducy-shuffle = { path = "../ducy-shuffle" }
ducy-identity = { path = "../ducy-identity" }
ducy-training = { path = "../ducy-training", optional = true }
ducy-bot-games = { path = "../ducy-bot-games", optional = true }
rand = "0.10.2"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
rust_decimal = "1.42.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
