[package]
name = "ducy-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducy = { path = "..", default-features = false }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
rust_decimal = "1.42.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
