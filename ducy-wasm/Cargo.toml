[package]
name = "ducy-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
# The site's bindings (ducy.cards), built with wasm-pack; not a crates.io crate.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ducy = { version = "0.3.0", path = "..", default-features = false }
ducy-play = { version = "0.1.0", path = "../ducy-play", default-features = false, features = ["serde"] }
ducy-gto = { path = "../ducy-gto", default-features = false, features = ["serde"] }
ducy-shuffle = { path = "../ducy-shuffle" }
rand = "0.10.2"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
rust_decimal = "1.42.1"
getrandom = { version = "0.4", features = ["wasm_js"] }
