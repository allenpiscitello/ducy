[package]
name = "ducy-training"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
description = "ducy.cards' study tools: practising pre-flop charts and ranges, their scoring, mastery and pacing."
repository = "https://github.com/allenpiscitello/ducy"
publish = false

[dependencies]
ducy = { version = "0.3.0", path = "..", default-features = false }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
